server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik (EasyPanel) terminates TLS and forwards the real client IP.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # The prerender proxy needs the visitor's host to resolve which store the
    # link belongs to, and the scheme to build absolute image URLs.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container-level healthcheck. The application's own health endpoint is the
    # backend's /api/v1/health, which Traefik routes to the API service.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Rewritten on every container start — must never be cached, or a redeployed
    # frontend keeps talking to the previous environment's API.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Product images. Proxied straight to the API on the internal network —
    # see the UPLOADS_UPSTREAM comment in docker-entrypoint.sh for why this
    # doesn't rely on Traefik routing /uploads to the api service directly.
    location /uploads/ {
        if ($uploads_upstream = "") {
            return 502;
        }
        proxy_pass http://$uploads_upstream;
    }

    # SPA fallback: every unknown path is a client-side route. index.html itself
    # must stay uncached so a deploy is picked up on the next reload.
    location / {
        # Link unfurlers don't run JavaScript, so the SPA's Open Graph tags never
        # exist for them. $prerender_upstream is set by the map in
        # 00-prerender.conf, which the entrypoint writes: it holds the API's
        # address for those user agents and is empty for everyone else — and
        # empty for everyone when PRERENDER_UPSTREAM is unset, which leaves this
        # block inert rather than broken.
        if ($prerender_upstream != "") {
            proxy_pass http://$prerender_upstream/api/v1/storefront/preview?path=$request_uri;
        }

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
